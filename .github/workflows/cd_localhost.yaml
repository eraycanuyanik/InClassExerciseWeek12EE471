name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Kill previous running instance
        run: |
          lsof -ti:8000 | xargs kill -9 2>/dev/null || true
          pkill -f "manage.py runserver" 2>/dev/null || true
          sleep 2

      - name: Launch app in background
        run: |
          bash publish/launch_app.sh
          sleep 5
          echo "Deployed version $(cat VERSION)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/polls/ || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "App failed to start"
            cat server.log 2>/dev/null || true
            exit 1
          fi
          echo "App is up ✅ (PID $(cat server.pid 2>/dev/null))"
