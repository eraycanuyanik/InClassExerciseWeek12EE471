name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Kill previous running instance
        run: |
          lsof -ti:8000 | xargs kill -9 2>/dev/null || true
          pkill -f "manage.py runserver" 2>/dev/null || true
          sleep 2

      - name: Launch app in background
        run: |
          cd djangotutorial
          nohup ../.venv/bin/python manage.py runserver 0.0.0.0:8000 \
            > "$RUNNER_TEMP/server.log" 2>&1 </dev/null &
          disown
          sleep 4
          echo "Deployed version $(cat ../VERSION)"
          # Health check: any HTTP response (incl. 404) means Django is up. Only network failure is a fail.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/polls/ || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "App failed to start"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          echo "App is up ✅"
